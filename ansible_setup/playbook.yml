- hosts: rpis
  tasks:
    - name: Install required apt packages
      become: true
      ansible.builtin.apt:
        name:
          - can-utils
          - chrony
          - debconf
          - debconf-utils
          - gh
          - git
          - htop
          - i2c-tools
          - iftop
          - nload
          - stress
          - tmux
        state: present
        update_cache: true #runs apt-get update if needed

    - name: Configure apt to install iperf3 automatically in daemon mode
      become: true
      ansible.builtin.debconf:
        name: iperf3
        question: iperf3/start_daemon
        value: true
        vtype: boolean
    
    - name: Configure apt to start iperf3 daemon
      become: true
      ansible.builtin.debconf:
        name: iperf3
        question: iperf3/start_at_boot
        value: true
        vtype: boolean

    - name: Install iperf3 package
      become: true
      ansible.builtin.apt:
        name: iperf3
        state: present

    - name: Clone dz_rpi_config repository
      become: true
      become_user: dan  
      ansible.builtin.git:
        repo: "https://github.com/danzimmerman/dz_rpi_config.git"
        dest: "/home/dan/dz_rpi_config"
        version: "bookworm"

    - name: Ensure ~/.bash_aliases is a symlink to repo version
      become: true
      become_user: dan
      ansible.builtin.file:
        src: "/home/dan/dz_rpi_config/bash_config/.bash_aliases"
        dest: "/home/dan/.bash_aliases"
        state: link
        force: true  # Overwrite if the file already exists

    - name: Ensure ~/.inputrc is a symlink to repo version
      become: true
      become_user: dan
      ansible.builtin.file:
        src: "/home/dan/dz_rpi_config/bash_config/.inputrc"
        dest: "/home/dan/.inputrc"
        state: link
        force: true  # Overwrite if the file already exists
    
    - name: Add bashrc additions from repo
      ansible.builtin.blockinfile:
        path: /home/dan/.bashrc
        block: |
          # Custom additions from dz_rpi_config
          if [ -f /home/dan/dz_rpi_config/bash_config/.bashrc_additions ]; then
            . /home/dan/dz_rpi_config/bash_config/.bashrc_additions
          fi
    
    - name: Ensure SPI is enabled in /boot/firmware/config.txt
      become: true
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "dtparam=spi=on"
        state: present

    - name: Add hardware-specific config to /boot/firmware/config.txt
      become: true
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        block: |
          # Enable SPI and configure two MCP2515 CAN controllers
          dtoverlay=mcp2515,spi0-0,oscillator=16000000,interrupt=25
          dtoverlay=mcp2515,spi0-1,oscillator=16000000,interrupt=23

          # Enable RTC battery charge
          dtparam=rtc_bbat_vchg=3000000

          # Disable Command Queueing for Samsung 128GB Card
          dtparam=sd_cqe=off

    - name: Add service to bring CANbus up at boot at 1MBit/s and set queue length to 1000
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/auto_canbus.service
        content: |
          [Unit]
          Description=Bring up CAN bus interfaces
          After=network.target

          [Service]
          Type=oneshot
            ExecStart=/sbin/ip link set can0 up type can bitrate 1000000
            ExecStart=/sbin/ip link set can0 txqueuelen 1000
            ExecStart=/sbin/ip link set can1 up type can bitrate 1000000
            ExecStart=/sbin/ip link set can1 txqueuelen 1000
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      notify:
        - enable_and_start_canbus_service_handler
    
    - name: Check if Miniforge is already installed
      ansible.builtin.stat:
        path: "/home/dan/.local/opt/miniforge3"
      register: miniforge_stat

    - name: Download miniforge installer script if miniconda3 is not already installed
      become: true
      become_user: dan # typically install conda as non-root user
      ansible.builtin.get_url:
        url: "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-aarch64.sh"
        dest: "/tmp/miniforge3-latest-Linux-aarch64.sh"
        mode: "0755"
      when: not miniforge_stat.stat.exists

    - name: Set up .local/bin directory
      become: true
      become_user: dan
      ansible.builtin.file:
        path: "/home/dan/.local/bin"
        state: directory
        mode: "0755"

    - name: Install Miniforge if it's not already installed
      become: true
      become_user: dan  
      ansible.builtin.command:
        cmd: "/tmp/miniforge3-latest-Linux-aarch64.sh -b -s -p /home/dan/.local/opt/miniforge3"
        creates: "/home/dan/.local/opt/miniforge3"
      when: not miniforge_stat.stat.exists
    
    - name: Remove Miniforge installer script after installation if it exists
      ansible.builtin.file:
        path: "/tmp/miniforge3-latest-Linux-aarch64.sh"
        state: absent

    - name: Softlink conda binary to ~/.local/bin
      become: true
      become_user: dan
      ansible.builtin.file:
        src: "/home/dan/.local/opt/miniforge3/bin/conda"
        dest: "/home/dan/.local/bin/conda"
        state: link
        force: true

    - name: Ensure eth0 is configured for DHCP with NetworkManager
      become: true
      community.general.nmcli:
        conn_name: wired_ethernet
        ifname: eth0
        type: ethernet
        state: present
        route_metric4: 100
        autoconnect: yes
        ip4: null  # null means DHCP

    - name: Remove default wired connection 1 with NetworkManager
      become: true
      community.general.nmcli:
        conn_name: Wired connection 1
        state: absent 

    - name: Configure NetworkManager.conf to check connectivity for route metric adjustment
      become: true
      ansible.builtin.blockinfile:
        path: /etc/NetworkManager/NetworkManager.conf
        block: |
          [connectivity]
          uri=http://network-test.debian.org/nm
          interval=10

    - name: Check if Robostack (jazzy) env is already installed
      ansible.builtin.stat:
        path: "/home/dan/.local/opt/miniforge3/envs/jazzy"
      register: jazzy_env_stat

    - name: Create Robostack (jazzy) conda environment if not already present
      become: true
      become_user: dan
      ansible.builtin.command:
        cmd: "/home/dan/.local/bin/conda create -y -n jazzy -c conda-forge -c robostack-jazzy ros-jazzy-desktop ros-jazzy-sbg-driver"
        creates: "/home/dan/.local/opt/miniforge3/envs/jazzy"
      when: not jazzy_env_stat.stat.exists
    
    - name: Activate env and add robostack channel using shell commands
      become: true
      become_user: dan
      ansible.builtin.shell: |
        source /home/dan/.local/opt/miniforge3/bin/activate jazzy
        conda config --add channels conda-forge
        conda config --add channels robostack-jazzy
      args:
        executable: /bin/bash
      when: not jazzy_env_stat.stat.exists

  handlers:
    - name: enable_and_start_canbus_service_handler
      become: true
      ansible.builtin.systemd:  
        name: auto_canbus.service
        enabled: true
        state: restarted